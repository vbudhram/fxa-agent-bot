<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- fxa-agent: the agent and an engineer in an epic-handshake clasp. Orange is
     the agent, sky blue the engineer. Square: Slack rounds the corners itself. -->
<rect width="512" height="512" fill="#592ACB"/>
<!-- burst above the clasp -->
<g stroke="#FFD567" stroke-width="16" stroke-linecap="round">
  <line x1="256" y1="28" x2="256" y2="66"/>
  <line x1="184" y1="50" x2="204" y2="84"/>
  <line x1="328" y1="50" x2="308" y2="84"/>
</g>
<!-- agent: a big forearm and bicep from the lower left -->
<path d="M226 196 C150 186 78 226 44 290 C16 344 -6 380 -24 420 L-24 560 L150 560
         C142 482 170 400 250 290 Z" fill="#FF7139"/>
<path d="M146 238 C92 262 58 316 48 382" stroke="#E0531C" stroke-width="13" fill="none" stroke-linecap="round"/>
<path d="M112 420 C96 452 90 484 92 512" stroke="#E0531C" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- engineer: the mirror from the lower right -->
<path d="M286 196 C362 186 434 226 468 290 C496 344 518 380 536 420 L536 560 L362 560
         C370 482 342 400 262 290 Z" fill="#00B3F4"/>
<path d="M366 238 C420 262 454 316 464 382" stroke="#0088C2" stroke-width="13" fill="none" stroke-linecap="round"/>
<path d="M400 420 C416 452 422 484 420 512" stroke="#0088C2" stroke-width="13" fill="none" stroke-linecap="round"/>
<!-- the clasp, larger and higher -->
<g transform="translate(256 190) scale(1.3) translate(-256 -234)">
  <rect x="218" y="186" width="120" height="96" rx="40" fill="#00B3F4" transform="rotate(-18 278 234)"/>
  <rect x="174" y="186" width="120" height="96" rx="40" fill="#FF7139" transform="rotate(18 234 234)"/>
  <g fill="#FF7139" stroke="#592ACB" stroke-width="6">
    <rect x="262" y="178" width="58" height="30" rx="15" transform="rotate(-18 291 193)"/>
    <rect x="270" y="208" width="60" height="30" rx="15" transform="rotate(-18 300 223)"/>
    <rect x="274" y="238" width="56" height="30" rx="15" transform="rotate(-18 302 253)"/>
  </g>
  <rect x="194" y="170" width="74" height="32" rx="16" fill="#00B3F4" stroke="#592ACB" stroke-width="6" transform="rotate(20 231 186)"/>
</g>
</svg>
