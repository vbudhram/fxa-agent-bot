# Paste into api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: fxa-agent
  description: Starts and steers FxA agent sessions from a thread.
features:
  bot_user:
    display_name: fxa-agent
    always_online: true
  app_home:
    home_tab_enabled: true
    # A DM starts a session for the people in DM_USERS; the bot also DMs the operator about errors.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /fxa-agent
      description: The agent sessions in this channel, or the commands
      usage_hint: "[status | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - files:write
      - files:read
      - commands
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - message.channels
      - message.groups
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
