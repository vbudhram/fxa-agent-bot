# Paste into api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: fxa-agent
  description: Starts and steers FxA agent sessions from a thread.
features:
  bot_user:
    display_name: fxa-agent
    always_online: true
  slash_commands:
    - command: /fxa-agent
      description: List the agent sessions that are running
      usage_hint: status
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - files:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
