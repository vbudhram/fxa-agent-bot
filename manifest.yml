# Paste into api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: fxa-agent
  description: Starts and steers FxA agent sessions from a thread.
features:
  bot_user:
    display_name: fxa-agent
    always_online: true
  app_home:
    home_tab_enabled: true
    # Read-only: the bot DMs the operator about new errors; nobody chats with it there.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  # Work Object cards (WORK_OBJECTS=1): the links whose hosts are listed here unfurl as
  # cards. Also turn on Work Object Previews and add the Task and
  # Incident entity types in the app settings (the toggle alone serves nothing).
  unfurl_domains:
    - mozilla-hub.atlassian.net
    - mozilla.sentry.io
    - github.com
  slash_commands:
    - command: /fxa-agent
      description: The agent sessions in this channel, or the commands
      usage_hint: "[status | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - files:write
      - files:read
      - commands
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email
      - links:read
      - links:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - message.channels
      - message.groups
      - reaction_added
      - link_shared
      - entity_details_requested
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  # Mozilla Slack is an Enterprise org: lets an admin deploy the app org-wide.
  org_deploy_enabled: true
