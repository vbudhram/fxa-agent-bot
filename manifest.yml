# Paste into api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: fxa-agent
  description: Starts and steers FxA agent sessions from a thread.
features:
  bot_user:
    display_name: fxa-agent
    always_online: true
  app_home:
    home_tab_enabled: true
    # Read-only: the bot DMs the operator about new errors; nobody chats with it there.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /fxa-agent
      description: List the agent sessions that are running
      usage_hint: status
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - files:write
      - commands
      - reactions:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
